[project]
name = "prism"
version = "0.1.0"
description = "Jacobian Bridge for Cross-Scale Decoding Alignment (Prism v3.0)"
authors = [{ name = "Michael Voronin", email = "m.voronin@ngenix.net" }]
requires-python = ">=3.13"
dependencies = [
  "torch>=2.1.0",
  "transformers>=5.15.0",
  "datasets>=2.14.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
  "papermill>=2.7.0",
  "testbook>=0.4.2",
]

[project.scripts]
prism = "prism:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
# build/ is a setuptools artifact (gitignored, regenerated); don't double-report.
# Notebooks are generated by build_kernel.py (rebuilt in the pipeline), not hand-edited.
exclude = [
    "^build/",
    'kaggle_kernel/[^/]+/kernel\.ipynb',
    'kaggle_kernel/kernel\.ipynb',
]

[tool.ruff]
line-length = 88
# Generated/packaging artifacts: not hand-written, regenerated by build_kernel.py / build.sh.
exclude = [
    "build",
    ".venv",
    "kaggle_kernel/**/kernel.ipynb",
]

[tool.ruff.lint]
# Keep ruff's default rule set (E4, E7, E9, F). Real issues are fixed in-source;
# generated notebooks are excluded above rather than papered over here.
