[project]
name = "prism"
version = "0.1.0"
description = "Jacobian Bridge for Cross-Scale Decoding Alignment (Prism v3.0)"
authors = [{ name = "Michael Voronin", email = "m.voronin@ngenix.net" }]
requires-python = ">=3.13"
dependencies = [
  "torch>=2.1.0",
  "transformers>=5.15.0",
  "datasets>=2.14.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
]

[project.scripts]
prism = "prism:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
