name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test: # read-only: no write/deploy jobs by design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest
      - name: Test
        run: python -m pytest tests -q
        env:
          HF_HUB_OFFLINE: "1" # hermetic: no network/model downloads in tests
